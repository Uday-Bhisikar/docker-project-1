apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docker-project-1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Uday-Bhisikar/docker-project-1.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: docker-project-1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
