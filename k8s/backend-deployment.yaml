apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: docker-project-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: uday1002/student-task-backend:v1.0.5
          ports:
            - containerPort: 80
